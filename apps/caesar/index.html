        <h2>シーザー暗号（ROT13）復号化ツール</h2>
        <div id="app">
          <p>アルファベットを一定の文字数だけずらす暗号です。</p><ul><li>例：１文字ずらしなら「a → b」「b → c」「z → a」</li></ul><p>特に１３文字ずらしのシーザー暗号は「ROT13」と呼ばれ、謎解きによく使われます。</p><hr/><h3>復号化したいテキスト</h3><div style="margin-bottom:1em;"><textarea rows="20" cols="50"></textarea><fieldset><legend>オプション</legend><label for="n">キー（シフト数）</label><input type="range" value="13" min="1" max="25" step="1"/>13 文字ずらし</fieldset></div>
        </div>
