        <h2>シーザー暗号を復号化するツール</h2>
        <p>シーザー暗号を復号化します。</p>
        <div id="app">
          <p>シーザー暗号は、アルファベットを一定の文字数だけずらす暗号です。</p><ul><li>例：１文字ずらしなら「a → b」「b → c」「z → a」</li></ul><p>特に１３文字ずらしのシーザー暗号は「ROT13」と呼ばれ、謎解きによく使われます。</p><hr/><div style="margin-bottom:1em;"><h3>復号化したい文字列</h3><textarea rows="20"></textarea><fieldset><legend>オプション</legend><label for="n">キー（シフト数）</label><input type="range" value="13" min="1" max="25" step="1"/>13 文字戻し（13 文字ずらし）</fieldset></div>
        </div>
