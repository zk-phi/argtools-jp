        <div id="app">
          綺麗に復元させるコツ：<ul><li>黒背景に明るい色で描く</li><li>文字やシンプルな図形などを埋め込む</li></ul><hr/><h3>埋め込みたい画像データ</h3><div style="margin-bottom:1em;"><input type="file" multiple/><fieldset><legend>オプション</legend><p><label for="h">解像度（周波数方向の分解能）</label><input name="h" type="number" value="128" min="16" max="320" step="1"/></p><p><label for="len">秒数（時間方向の分解能）</label><input name="len" type="number" value="5" min="1" max="30" step="1"/></p></fieldset><p><button type="button">作成</button></p></div>
